  <path class="l" d="M150 125 L400 195"/>
  <path class="l" d="M550 205 L630 150"/>
  <path class="l" d="M700 185 L760 240"/>
  <path class="l" d="M865 185 L820 240"/>
  <path class="l" d="M670 185 L705 335"/>
  <path class="l" d="M705 380 L520 430"/>
  <path class="l" d="M865 380 L690 430" stroke-dasharray="4 3"/>
  <path class="l" d="M855 430 L800 310" stroke-dasharray="4 3"/>
  <path class="l" d="M740 185 L835 335" stroke-dasharray="4 3"/>
</svg>
